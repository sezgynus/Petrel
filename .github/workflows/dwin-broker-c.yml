name: DWIN C Broker
on:
  workflow_dispatch:
  push:
    branches: ['**']
    paths:
      - 'native/**'
      - 'kernel/dwin_uart/**'
      - 'petrel/hardware/dwin/**'
      - 'petrel/hardware/dwin/driver.py'
      - 'petrel/hardware/dwin/startup.py'
      - 'tools/dwin_uart_install.py'
      - 'tools/ci/dwin*'
      - 'tests/test_dwin*.py'
      - 'tests/test_uart*.py'
      - 'install.sh'
      - 'configure.sh'
      - 'Kconfig'
      - 'tools/configure.py'
      - 'tools/env_defaults.py'
      - 'Petrel.env.example'
      - '.github/workflows/dwin*.yml'
  pull_request:
    branches: [master]
    paths:
      - 'native/**'
      - 'kernel/dwin_uart/**'
      - 'petrel/hardware/dwin/**'
      - 'petrel/hardware/dwin/driver.py'
      - 'petrel/hardware/dwin/startup.py'
      - 'tools/dwin_uart_install.py'
      - 'tools/ci/dwin*'
      - 'tests/test_dwin*.py'
      - 'tests/test_uart*.py'
      - 'install.sh'
      - 'configure.sh'
      - 'Kconfig'
      - 'tools/configure.py'
      - 'tools/env_defaults.py'
      - 'Petrel.env.example'
      - '.github/workflows/dwin*.yml'
permissions:
  contents: read
jobs:
  cross:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - compiler: arm-linux-gnueabihf-gcc
            packages: gcc-arm-linux-gnueabihf libc6-dev-armhf-cross
          - compiler: aarch64-linux-gnu-gcc
            packages: gcc-aarch64-linux-gnu libc6-dev-arm64-cross
    steps:
      - uses: actions/checkout@v4
      - name: Install ARM toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ${{ matrix.packages }}
      - name: Cross-compile for Raspberry Pi user spaces
        run: |
          make -C native CC=${{ matrix.compiler }}
          file native/petrel-dwin-broker
  native:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        mode: [release, sanitize]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Build production executable and packet-backend contract executable
        shell: bash
        run: |
          make -C native
          flags='-Os'
          if [ '${{ matrix.mode }}' = sanitize ]; then
            flags='-O1 -g -fsanitize=address,undefined -fno-omit-frame-pointer -fno-pie -no-pie'
          fi
          cc $flags -std=c11 -Wall -Wextra -Werror -Wformat=2 -DDWIN_TEST_BACKEND \
            native/dwin_broker.c -lm -o "$RUNNER_TEMP/dwin-broker-contract"
      - name: Exercise PTY serial, real packet sockets, faults and binary streams
        env:
          DWIN_C_BROKER: ${{ runner.temp }}/dwin-broker-contract
          ASAN_OPTIONS: detect_leaks=1:abort_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: python -m unittest discover -s tests -p test_dwin_native.py -v
