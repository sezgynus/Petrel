name: DWIN UART Kernel
on:
  workflow_dispatch:
  push:
    branches: ['**']
    paths:
      - 'native/**'
      - 'kernel/dwin_uart/**'
      - 'dwin_*.py'
      - 't5uic1_driver.py'
      - 'uart_startup.py'
      - 'tools/dwin_uart_install.py'
      - 'tools/ci/dwin*'
      - 'tests/test_dwin*.py'
      - 'tests/test_uart*.py'
      - 'install.sh'
      - 'configure.sh'
      - 'Kconfig'
      - 'tools/configure.py'
      - 'tools/env_defaults.py'
      - 'Petrel.env.example'
      - '.github/workflows/dwin*.yml'
  pull_request:
    branches: [master]
    paths:
      - 'native/**'
      - 'kernel/dwin_uart/**'
      - 'dwin_*.py'
      - 't5uic1_driver.py'
      - 'uart_startup.py'
      - 'tools/dwin_uart_install.py'
      - 'tools/ci/dwin*'
      - 'tests/test_dwin*.py'
      - 'tests/test_uart*.py'
      - 'install.sh'
      - 'configure.sh'
      - 'Kconfig'
      - 'tools/configure.py'
      - 'tools/env_defaults.py'
      - 'Petrel.env.example'
      - '.github/workflows/dwin*.yml'
permissions:
  contents: read
jobs:
  kernel:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        distribution: [bookworm, trixie]
    container: debian:${{ matrix.distribution }}
    steps:
      - uses: actions/checkout@v4
      - name: Install packaged kernel and VM test tools
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            build-essential linux-headers-amd64 linux-image-amd64 busybox-static \
            qemu-system-x86 cpio kmod
      - name: Compile module and exercise real TTY APIs in isolated Linux
        run: bash tools/ci/dwin_kernel_smoke.sh
