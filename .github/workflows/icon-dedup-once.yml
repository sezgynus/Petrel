name: Apply Verified 14-Icon Cleanup
on:
  push:
    branches:
      - feature/icon-library-dedup-14
permissions:
  contents: read
concurrency:
  group: icon-dedup-feature
  cancel-in-progress: true
jobs:
  migrate-verify-push:
    if: github.actor == 'sezgynus-commit-signing-bot[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Generate push token
        id: token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.SIGNING_APP_ID }}
          private-key: ${{ secrets.SIGNING_APP_PRIVATE_KEY }}
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ steps.token.outputs.token }}
          fetch-depth: 4
          persist-credentials: true
      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Test dependencies
        run: |
          python -m pip install pyserial==3.5 websocket-client==1.9.2 Pillow==12.3.0 gpiozero==2.0.1.post3 qrcode==8.2 kconfiglib==14.1.0
          sudo apt-get update
          sudo apt-get install -y libnfc-dev
      - name: Apply deduplication exactly once
        run: python tools/migrate_icon_dedup_14.py
      - name: Compile all Python
        run: python -m compileall -q .
      - name: Full Python regression
        env:
          GPIOZERO_PIN_FACTORY: mock
        run: python -m unittest discover -s tests -v
      - name: Install commit signing key
        env:
          SIGNING_KEY: ${{ secrets.COMMIT_SIGNING_KEY }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$SIGNING_KEY" > ~/.ssh/github_actions_signing
          chmod 600 ~/.ssh/github_actions_signing
          git config user.name "Sezgin AÇIKGÖZ"
          git config user.email "sezginacikgoz@mail.com"
          git config gpg.format ssh
          git config user.signingkey ~/.ssh/github_actions_signing
          git config commit.gpgsign true
      - name: Commit verified production files (remove one-shot runner)
        run: |
          git rm .github/workflows/icon-dedup-once.yml tools/migrate_icon_dedup_14.py
          git add -A
          git diff --cached --stat
          git commit -S -m "refactor(icons): remove 14 redundant resources and compact to 186 IDs"
          git push origin HEAD:feature/icon-library-dedup-14
