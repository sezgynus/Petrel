name: Petrel Regression Suite

on:
  workflow_dispatch:
  pull_request:
    branches:
      - master
  push:
    branches:
      - '**'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GPIOZERO_PIN_FACTORY: mock
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test dependencies
        run: python -m pip install pyserial==3.5 websocket-client==1.9.2 Pillow==12.3.0 gpiozero==2.0.1.post3 qrcode==8.2 kconfiglib==14.1.0
      - name: Install libnfc headers for real ABI verification
        run: sudo apt-get update && sudo apt-get install -y libnfc-dev
      - name: Verify distro libnfc exports PN53x register ABI (no custom .so)
        shell: bash
        run: |
          python - <<'PY'
          import ctypes
          import ctypes.util
          name = ctypes.util.find_library('nfc')
          assert name, 'System libnfc not installed'
          library = ctypes.CDLL(name)
          assert hasattr(library, 'pn53x_write_register'), 'Private PN53x register symbol missing'
          print('System libnfc register API available:', name)
          PY
      - name: Compile Python sources
        run: python -m compileall -q .
      - name: Run regression suite
        run: python -m unittest discover -s tests -v
      - name: Compare incremental UI state with legacy copying
        run: python tools/benchmark_ui_state.py
      - name: Report uninstrumented Maintenance RSS/PSS/USS
        run: python tools/benchmark_maintenance_discovery.py --fans 150 --runs 20
      - name: Report traced Maintenance allocations
        run: python tools/benchmark_maintenance_discovery.py --fans 150 --runs 20 --trace
      - name: Compare generic usage collector with signed baseline
        shell: bash
        run: |
          git fetch --no-tags --depth=1 origin a1c01ef13249e2b9b703cd3a97f7b27b8d24600c
          git show a1c01ef13249e2b9b703cd3a97f7b27b8d24600c:maintenance_records.py > "$RUNNER_TEMP/petrel-usage-baseline.py"
          python tools/benchmark_maintenance_usage.py --baseline-file "$RUNNER_TEMP/petrel-usage-baseline.py"
      - name: Fetch pinned Klipper source for native travel verification
        uses: actions/checkout@v4
        with:
          repository: Klipper3d/klipper
          ref: c63b29510b1f9ff0a8d10ee55b29cb843fdba4e0
          path: .ci-klipper-travel
          persist-credentials: false
      - name: Verify native trapq travel and report synthetic cost
        run: python tools/benchmark_axis_travel.py --klipper-source .ci-klipper-travel
