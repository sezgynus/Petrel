name: Petrel Regression Suite

on:
  workflow_dispatch:
  pull_request:
    branches:
      - master
  push:
    branches:
      - '**'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GPIOZERO_PIN_FACTORY: mock
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test dependencies
        run: python -m pip install pyserial==3.5 websocket-client==1.9.2 Pillow==12.3.0 gpiozero==2.0.1.post3 qrcode==8.2 kconfiglib==14.1.0
      - name: Install libnfc headers for real ABI verification
        run: sudo apt-get update && sudo apt-get install -y libnfc-dev
      - name: Verify distro libnfc exports PN53x register ABI (no custom .so)
        run: python tools/nfc_target_system_modedet.py probe
      - name: Compile Python sources
        run: python -m compileall -q .
      - name: Run regression suite
        run: python -m unittest discover -s tests -v
      - name: Compare incremental UI state with legacy copying
        run: python tools/benchmark_ui_state.py
      - name: Report uninstrumented Maintenance RSS/PSS/USS
        run: python tools/benchmark_maintenance_discovery.py --fans 150 --runs 20
      - name: Report traced Maintenance allocations
        run: python tools/benchmark_maintenance_discovery.py --fans 150 --runs 20 --trace
      - name: Compare generic usage collector with signed baseline
        shell: bash
        run: |
          git fetch --no-tags --depth=1 origin a1c01ef13249e2b9b703cd3a97f7b27b8d24600c
          git show a1c01ef13249e2b9b703cd3a97f7b27b8d24600c:maintenance_records.py > "$RUNNER_TEMP/petrel-usage-baseline.py"
          python tools/benchmark_maintenance_usage.py --baseline-file "$RUNNER_TEMP/petrel-usage-baseline.py"
      - name: Fetch pinned Klipper source for native travel verification
        uses: actions/checkout@v4
        with:
          repository: Klipper3d/klipper
          ref: c63b29510b1f9ff0a8d10ee55b29cb843fdba4e0
          path: .ci-klipper-travel
          persist-credentials: false
      - name: Verify native trapq travel and report synthetic cost
        run: python tools/benchmark_axis_travel.py --klipper-source .ci-klipper-travel

  pn532-native-diagnostics:
    name: Build isolated PN532 native diagnostic libnfc
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned libnfc build dependencies
        run: sudo apt-get update && sudo apt-get install -y autoconf automake libtool pkg-config libusb-dev libusb-1.0-0-dev libpcsclite-dev
      - name: Compile original 0x05 PN532 mode with observation-only diagnostics
        run: bash tools/build_pn532_picc_libnfc.sh diag
      - name: Verify native library, diagnostic symbols and exact upstream mode marker
        shell: bash
        run: |
          set -euo pipefail
          root="${HOME}/.local/share/Petrel/libnfc-pn532-diagnostics"
          test -s "$root/lib/libnfc.so.6"
          grep -Fx 'libnfc-1.8.0 PN532 target diagnostics mode=0x05 v1' "$root/.petrel-nfc-diagnostics"
          grep -a -q PETREL_NFC_DIAG "$root/lib/libnfc.so.6"
          ldd "$root/lib/libnfc.so.6"

  pn532-native-modedet:
    name: Compile isolated PN532 ModeDetOff register experiment
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned libnfc build dependencies
        run: sudo apt-get update && sudo apt-get install -y autoconf automake libtool pkg-config libusb-dev libusb-1.0-0-dev libpcsclite-dev
      - name: Compile PN532 PICC 0x04 plus CIU_Mode masked bit-2 experiment
        run: bash tools/build_pn532_picc_libnfc.sh modedet
      - name: Verify isolated library, marker, and register diagnostics
        shell: bash
        run: |
          set -euo pipefail
          root="${HOME}/.local/share/Petrel/libnfc-pn532-modedet"
          test -s "$root/lib/libnfc.so.6"
          grep -Fx 'libnfc-1.8.0 PN532 ModeDetOff mode=0x04 bit=0x04 v1' "$root/.petrel-nfc-modedet"
          grep -a -q 'PETREL_NFC_MODEDET set' "$root/lib/libnfc.so.6"
          grep -a -q 'PETREL_NFC_MODEDET restore' "$root/lib/libnfc.so.6"
          ldd "$root/lib/libnfc.so.6"

  pn532-native-modedet05:
    name: Build isolated PN532 upstream 0x05 ModeDetOff experiment
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned libnfc build dependencies
        run: sudo apt-get update && sudo apt-get install -y autoconf automake libtool pkg-config libusb-dev libusb-1.0-0-dev libpcsclite-dev
      - name: Compile unmodified 0x05 Mode with CIU_Mode bit-2 experiment
        run: bash tools/build_pn532_picc_libnfc.sh modedet05
      - name: Verify native build and phase-specific failure tracing
        shell: bash
        run: |
          set -euo pipefail
          root="${HOME}/.local/share/Petrel/libnfc-pn532-modedet05"
          test -s "$root/lib/libnfc.so.6"
          grep -Fx 'libnfc-1.8.0 PN532 ModeDetOff mode=0x05 bit=0x04 v2' "$root/.petrel-nfc-modedet"
          grep -a -q 'PETREL_NFC_MODEDET set' "$root/lib/libnfc.so.6"
          grep -a -q 'PETREL_NFC_MODEDET restore' "$root/lib/libnfc.so.6"
          grep -a -q 'phase=restore_verify' "$root/lib/libnfc.so.6"
          grep -a -q 'phase=timeout_idle' "$root/lib/libnfc.so.6"
          grep -a -q 'phase=tg_init' "$root/lib/libnfc.so.6"
          grep -a -q 'target_activated mode=' "$root/lib/libnfc.so.6"
          ldd "$root/lib/libnfc.so.6"
