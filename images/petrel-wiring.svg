<text x="50" y="306" class="small muted">Pin 1: lower left → Pin 39: lower right. Pin 2: upper left → Pin 40: upper right.</text>
<text x="70" y="354" class="heading">Physical pin</text><text x="270" y="354" class="heading">BCM / function</text><text x="620" y="354" class="heading">Connect to</text>
<line x1="50" y1="372" x2="1050" y2="372" class="rule"/>
<g id="power-connection"><circle cx="65" cy="400" r="6" fill="#e96b68"/><text id="power-physical" x="90" y="407" class="value">2</text><text id="power-bcm" x="270" y="407" class="value">5 V</text><text x="620" y="407" class="value">Display VCC</text></g>
<g id="ground-connection"><circle cx="65" cy="444" r="6" fill="#8c9aaa"/><text id="ground-physical" x="90" y="451" class="value">6</text><text id="ground-bcm" x="270" y="451" class="value">GND</text><text x="620" y="451" class="value">Common ground</text></g>
<g id="uart-tx-connection"><circle cx="65" cy="488" r="6" fill="#57c8dd"/><text id="uart-tx-physical" x="90" y="495" class="value">8</text><text id="uart-tx-bcm" x="270" y="495" class="value">GPIO14 / TX</text><text x="620" y="495" class="value">Display RX</text></g>
<g id="uart-rx-connection"><circle cx="65" cy="532" r="6" fill="#57c8dd"/><text id="uart-rx-physical" x="90" y="539" class="value">10</text><text id="uart-rx-bcm" x="270" y="539" class="value">GPIO15 / RX</text><text x="620" y="539" class="value">Display TX</text></g>
<g id="encoder-a-connection"><circle cx="65" cy="576" r="6" fill="#7cd6b1"/><text id="encoder-a-physical" x="90" y="583" class="value">40</text><text id="encoder-a-bcm" x="270" y="583" class="value">GPIO21</text><text x="620" y="583" class="value">Encoder A</text></g>
<g id="encoder-b-connection"><circle cx="65" cy="620" r="6" fill="#7cd6b1"/><text id="encoder-b-physical" x="90" y="627" class="value">36</text><text id="encoder-b-bcm" x="270" y="627" class="value">GPIO16</text><text x="620" y="627" class="value">Encoder B</text></g>
<g id="encoder-button-connection"><circle cx="65" cy="664" r="6" fill="#c09de9"/><text id="encoder-button-physical" x="90" y="671" class="value">38</text><text id="encoder-button-bcm" x="270" y="671" class="value">GPIO20</text><text x="620" y="671" class="value">Encoder button</text></g>
<g id="buzzer-connection"><circle cx="65" cy="708" r="6" fill="#efbe67"/><text id="buzzer-physical" x="90" y="715" class="value">35</text><text id="buzzer-bcm" x="270" y="715" class="value">GPIO19 / PWM1</text><text x="620" y="715" class="value">Buzzer driver input</text></g>
<line x1="50" y1="744" x2="1050" y2="744" class="rule"/>
<text x="50" y="786" class="small">GPIO19 is the control input to a suitable buzzer driver; share the ground connection.</text>
<text x="50" y="817" class="small">UART is crossed: Pi TX → display RX; Pi RX ← display TX.</text>
<text x="50" y="848" class="small muted">Existing installations may use other encoder pins. Keep wiring and configure.sh settings aligned.</text>
<text x="50" y="875" class="small muted">BCM identifiers and physical header numbers are different. This drawing uses the current install defaults.</text>
</svg>
