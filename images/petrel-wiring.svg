<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="900" viewBox="0 0 1100 900" role="img" aria-labelledby="title description">
<title id="title">Petrel default Raspberry Pi wiring</title>
<desc id="description">Standard 40-pin Raspberry Pi header, top view. Physical pin 1 is lower left and pin 40 upper right. Encoder A GPIO21 pin40, encoder B GPIO16 pin36, button GPIO20 pin38, hardware PWM buzzer driver GPIO19 pin35. UART GPIO14 pin8 goes to display RX and GPIO15 pin10 goes to display TX. Display power uses pin2 5V and pin6 GND.</desc>
<style>text{font-family:Arial,DejaVu Sans,sans-serif;fill:#edf2f7}.muted{fill:#b9c5d2}.small{font-size:16px}.pin-number{font-size:14px;text-anchor:middle}.heading{font-size:18px;font-weight:bold}.value{font-size:20px}.rule{stroke:#3e4b59;stroke-width:1}</style>
<rect width="1100" height="900" rx="20" fill="#18212b"/>
<text x="50" y="55" font-size="30" font-weight="bold">Petrel · Default wiring</text>
<text x="50" y="86" class="small muted">Raspberry Pi 40-pin header · top view · physical pin numbers shown at the connector</text>
